name = "onmind-xid"
main = "src/index.js"
compatibility_date = "2026-08-01"
compatibility_flags = ["nodejs_compat"]

[vars]
# Safe default for `wrangler deploy`; `bun run cf:dev` overrides it to dev.
XID_ENV = "production"
# Public origin used when the proxy does not send X-Forwarded-* headers.
# XID_PUBLIC_URL = "https://id.example.com"

# Cloudflare Email Service: env.MAIL.send({ to, from, subject, text })
[[send_email]]
name = "MAIL"

# Create namespaces and paste ids:
#   wrangler kv namespace create XID_META
#   wrangler kv namespace create XID_USERS
#   wrangler kv namespace create XID_FILES
#   wrangler kv namespace create XID_CLIENTS
[[kv_namespaces]]
binding = "XID_META"
id = "REPLACE_WITH_XID_META_NAMESPACE_ID"

[[kv_namespaces]]
binding = "XID_USERS"
id = "REPLACE_WITH_XID_USERS_NAMESPACE_ID"

[[kv_namespaces]]
binding = "XID_FILES"
id = "REPLACE_WITH_XID_FILES_NAMESPACE_ID"

[[kv_namespaces]]
binding = "XID_CLIENTS"
id = "REPLACE_WITH_XID_CLIENTS_NAMESPACE_ID"